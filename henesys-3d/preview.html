<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Henesys 3D Models</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <style>
    body { touch-action: none; }
    .bar { position: fixed; left: 0; right: 0; bottom: calc(14px + var(--safe-b)); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 0 16px; }
    .bar button, .bar select { font: 16px var(--display); border: 3px solid var(--ink); border-radius: 999px; background: var(--panel); padding: 8px 14px; box-shadow: 0 3px 0 var(--ink); color: var(--ink); }
    .bar button.on { background: var(--orange); color: #fff; }
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
  <canvas id="game" style="position:fixed;inset:0;width:100%;height:100%"></canvas>
  <div class="bar">
    <select id="pick" aria-label="Model"></select>
    <button data-s="idle" class="on">Idle</button>
    <button data-s="move">Move</button>
    <button id="hit">Hit</button>
    <button id="atk">Attack</button>
    <button data-s="die">Die</button>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { addDaylight } from './src/assets/toon.js';
    import { buildMob, MOB_IDS } from './src/assets/mobs.js';
    import { loadKayKit, buildHero, buildNpc, NPC_IDS } from './src/assets/kaykit.js';
    await loadKayKit();
    const HEROES = ['beginner', 'warrior', 'magician', 'bowman', 'thief'];

    const MODELS = Object.fromEntries([...MOB_IDS.map(id => [id, () => buildMob(id)]), ...HEROES.map(j => ['hero_' + j, () => buildHero({ hairStyle: ['rogue', 'knight', 'mage', 'barbarian', 'hooded'][HEROES.indexOf(j)], hair: 0xc0392b, shirt: 0x3d6fd1 }, j)]), ...NPC_IDS.map(id => ['npc_' + id, () => buildNpc(id)])]);

    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fd0ff);
    addDaylight(scene);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 48), new THREE.MeshToonMaterial({ color: 0x7ccf4e }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    let yaw = 0.5, pitch = 0.25, dist = 4.2, model = null, state = 'idle', current;

    function show(id) {
      if (model) scene.remove(model.object3d);
      current = id; model = MODELS[id]();
      scene.add(model.object3d);
      dist = Math.max(3.6, model.height * 3);
      state = 'idle'; setOn();
    }
    const pick = document.getElementById('pick');
    for (const id of Object.keys(MODELS)) pick.add(new Option(id, id));
    pick.onchange = () => show(pick.value);
    const setOn = () => document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === state));
    document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { if (state === 'die' || b.dataset.s === 'die') show(current); state = b.dataset.s; setOn(); });
    document.getElementById('hit').onclick = () => model.hit?.();
    document.getElementById('atk').onclick = () => model.attack?.();

    let drag = null;
    canvas.addEventListener('pointerdown', e => drag = { x: e.clientX, y: e.clientY });
    addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - drag.x) * 0.01; pitch = Math.min(1.2, Math.max(0, pitch + (e.clientY - drag.y) * 0.006)); drag = { x: e.clientX, y: e.clientY }; });
    addEventListener('pointerup', () => drag = null);

    function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
    addEventListener('resize', resize); resize();

    let t = 0;
    function step(dt, render = true) {
      t += dt;
      model.animate(state, dt, t, state === 'move' || state === 'walk' ? 1 : 0);
      const h = model.height * 0.5;
      camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, h + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
      camera.lookAt(0, h, 0);
      if (render) renderer.render(scene, camera);
    }
    show(MOB_IDS.at(-1));
    let last = performance.now();
    (function loop(now) { step(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); })(last);

    // Hooks for tests/preview-shots.mjs
    window.__preview = {
      ids: Object.keys(MODELS),
      show, setState: s => { state = s; },
      hit: () => model.hit?.(),
      /** Runs `secs` of `st` and reports whether every world position stayed finite. */
      soak(st, secs) {
        state = st;
        if (st === 'attack') model.attack?.();
        for (let i = 0; i < secs * 60; i++) step(1 / 60, false);
        let ok = true;
        const v = new THREE.Vector3();
        model.object3d.traverse(o => { o.getWorldPosition(v); if (!Number.isFinite(v.x + v.y + v.z)) ok = false; });
        return ok;
      },
    };
  </script>
</body>
</html>
