name: Deploy Void Runner to GitHub Pages

# Manual trigger. Enable Pages first: Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Serve the game at both /Ofek/ and /Ofek/spaceship-game/ so every shared link works.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r spaceship-game/. _site/
          cp -r spaceship-game _site/spaceship-game
          cp stage-simulator.html _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
