name: Build Zombie Raid APK

# Builds an Android APK of zombie-game/ on every push that touches it, and on demand.
# The APK is attached to the "zombie-apk" release (a stable download link) and kept as a run artifact.
on:
  push:
    paths:
      - 'zombie-game/**'
      - '.github/workflows/zombie-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zombie-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy the game into the Android project
        run: bash zombie-game/tools/prepare-android.sh
      - name: Build the APK
        run: gradle -p zombie-game/android assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp zombie-game/android/app/build/outputs/apk/release/app-release.apk ZombieRaid.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZombieRaid-apk
          path: ZombieRaid.apk
      - name: Remove the APK from before the rename
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset zombie-apk OfekVsZombies.apk -y -R ${{ github.repository }} || true
      - name: Publish to the zombie-apk release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zombie-apk
          name: Zombie Raid (Android)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            build: ${{ github.run_number }}
            Android build of Zombie Raid, from commit ${{ github.sha }}.
            Install: download ZombieRaid.apk on the phone, open it, and allow installing from this source.
          files: ZombieRaid.apk
