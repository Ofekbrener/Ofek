<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#8a1414"/><stop offset=".55" stop-color="#3d0707"/><stop offset="1" stop-color="#0d0202"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cf6a"/><stop offset=".6" stop-color="#6f9a3e"/><stop offset="1" stop-color="#3d5a22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity=".9"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background"><rect width="108" height="108" fill="url(#bg)"/></g>
  <g id="foreground"><g transform="translate(54 54) scale(.86) translate(-54 -51)">
    <!-- glow from the crack -->
    <ellipse cx="54" cy="70" rx="26" ry="7" fill="url(#glow)"/>
    <!-- hand: forearm, palm, four clawed fingers, thumb -->
    <g stroke="#152008" stroke-width="1.6" stroke-linejoin="round" fill="url(#skin)">
      <path d="M46 71 L47 56 Q47 52 50 51 L60 51 Q63 52 63 56 L62 71 Z"/>
      <path d="M47 55 Q44 54 41.5 49 Q40 45.5 42.5 44.5 Q44.5 44 46 47.5 L48.5 51 Z"/>
      <path d="M49 52 L47.5 37 Q47 33.5 49.5 33 Q52 33 52.3 36.5 L53 51 Z"/>
      <path d="M52.6 51 L53 30 Q53 26.5 55.6 26.4 Q58.2 26.5 58 30 L57.4 51 Z"/>
      <path d="M57.2 51 L58.6 33 Q59 29.6 61.5 29.9 Q63.8 30.3 63.3 33.6 L61.4 52 Z"/>
      <path d="M61 53 L64.5 39.5 Q65.5 36.6 67.6 37.3 Q69.5 38.2 68.6 41 L63.5 56 Z"/>
    </g>
    <!-- claws -->
    <g fill="#e9e2c8" stroke="#152008" stroke-width=".7">
      <path d="M48 34 L49 29.5 L51.6 33.6 Z"/><path d="M53.6 27.3 L55.4 22.5 L57.6 27.3 Z"/>
      <path d="M59.2 31 L61.5 26.4 L63 31.2 Z"/><path d="M65.3 38.2 L68.6 34.6 L68.9 39 Z"/><path d="M41.6 45.6 L41 41.6 L44.4 44.6 Z"/>
    </g>
    <!-- wounds and knuckle lines -->
    <g stroke="#2f4614" stroke-width=".8" fill="none" stroke-linecap="round">
      <path d="M50 44 l2.5 .3"/><path d="M54 40 l3 0"/><path d="M59.5 42 l2.6 .4"/><path d="M50 62 q4 1.5 9 0"/>
    </g>
    <path d="M55.5 57 q2.5 -1 3.5 1.5 q-1.5 2.5 -4 1 z" fill="#7a0d0d" stroke="#3a0505" stroke-width=".5"/>
    <!-- torn sleeve -->
    <path d="M44.5 66 L64 66 L63.5 72 L61 69.8 L58.6 72.6 L56 70 L53 72.8 L50.4 70.2 L47.6 72.6 L45 70 Z" fill="#3a4a6a" stroke="#0e1424" stroke-width="1"/>
    <!-- cracked asphalt -->
    <path d="M27 76 Q30 71 38 71.5 L44 70 L48 73 L54 70.5 L60 73 L65 70 L71 71.5 Q79 71 81 76 Q70 80 54 80 Q38 80 27 76 Z" fill="#1b1b1f" stroke="#000" stroke-width="1"/>
    <g stroke="#ff6a2a" stroke-width=".9" fill="none" stroke-linecap="round">
      <path d="M44 70 L41 75 L36 77"/><path d="M65 70 L68 74.5 L74 76"/><path d="M54 72 L53 78"/>
    </g>
  </g></g>
</svg>
