<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Editor — Stage Difficulty Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 20px; min-height: 100vh; }
  .container { max-width: 1400px; margin: 0 auto; }
  select, input[type="text"], input[type="number"] {
    background: #0a0a14; color: #fff; border: 1px solid #2a2a3e; border-radius: 4px;
    padding: 4px 8px; font-size: 12px; font-family: 'Courier New', monospace; outline: none;
  }
  select { background: #161622; }
  .btn {
    background: transparent; color: #888; border: 1px solid #2a2a3e; border-radius: 4px;
    padding: 4px 12px; font-size: 11px; font-family: 'Courier New', monospace; cursor: pointer;
  }
  .btn:hover { color: #ccc; border-color: #555; }
  .btn-primary { background: #F39C12; color: #000; border: none; font-weight: 600; }
  .btn-primary:hover { background: #e08e0b; }
  .btn-primary:disabled { background: #1a1a2e; color: #555; cursor: not-allowed; }
  .btn-green { background: #2ECC71; color: #000; border: none; font-weight: 600; }
  .btn-blue { background: #3498DB; color: #000; border: none; font-weight: 600; }
  .btn-danger { background: transparent; color: #E74C3C; border-color: #E74C3C44; }
  .panel { padding: 12px; background: #12121e; border-radius: 8px; border: 1px solid #1e1e30; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div style="margin-bottom:20px;display:flex;align-items:center;gap:12px">
    <span style="font-size:28px">🗺️</span>
    <div>
      <h1 style="font-size:22px;font-weight:700;color:#fff">Journey Editor</h1>
      <p style="font-size:11px;color:#666;margin-top:2px">Create, edit and simulate multiple boards side by side</p>
    </div>
  </div>

  <!-- Top controls -->
  <div class="panel" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <label style="font-size:11px;color:#888;display:flex;align-items:center;gap:6px">
      Boards in journey:
      <input type="number" id="boardCount" value="5" min="1" max="30" style="width:50px">
      <button class="btn btn-green" onclick="initJourney()">Create</button>
    </label>
    <div style="height:20px;border-left:1px solid #2a2a3e"></div>
    <label style="font-size:11px;color:#888;display:flex;align-items:center;gap:6px">
      Import journey:
      <input type="text" id="journeyImportInput" placeholder="board1$board2$board3..." style="width:300px;color:#aaa">
      <button class="btn btn-blue" onclick="importJourney()">Import</button>
    </label>
    <div style="height:20px;border-left:1px solid #2a2a3e"></div>
    <button class="btn btn-primary" id="simAllBtn" onclick="simulateAll()" disabled>Simulate All (20K)</button>
    <button class="btn" onclick="exportJourney()" id="exportBtn" disabled>Export All</button>
  </div>

  <!-- Aggregate stats -->
  <div id="aggStats" class="panel hidden" style="margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"></div>

  <!-- Export display -->
  <div id="exportPanel" class="panel hidden" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:0.5px">Export String ($ separated)</span>
      <button class="btn" onclick="copyExport()" id="copyBtn" style="padding:2px 12px;font-size:10px">Copy</button>
    </div>
    <div id="exportStr" style="font-size:11px;color:#F39C12;word-break:break-all;line-height:1.6;padding:8px;background:#0a0a14;border-radius:4px;font-weight:500;letter-spacing:0.5px;max-height:120px;overflow-y:auto"></div>
  </div>

  <!-- Boards grid -->
  <div id="boardsContainer" style="display:flex;flex-wrap:wrap;gap:14px"></div>

  <!-- New Item Exposure Table -->
  <div id="exposureSection" class="panel hidden" style="margin-top:20px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span style="font-size:18px">🆕</span>
      <div>
        <div style="font-size:14px;font-weight:700;color:#fff">Item Introduction Map</div>
        <div style="font-size:10px;color:#666">Shows when each item size first appears in the journey</div>
      </div>
    </div>
    <div id="exposureTable"></div>
    <div id="exposureTimeline" style="margin-top:14px"></div>
    <div id="unusedItems" style="margin-top:14px"></div>
  </div>
</div>

<script>
const ITEM_COLORS = ["#E74C3C","#3498DB","#2ECC71","#F39C12","#9B59B6","#1ABC9C","#E67E22","#EC407A","#26C6DA","#AB47BC","#FF7043","#66BB6A","#42A5F5","#FFCA28","#8D6E63"];
const SHIPS = [[1,2],[1,3],[1,4],[2,1],[2,2],[2,3],[2,4],[3,1],[3,2],[3,3],[3,4],[4,1],[4,2],[4,3],[4,4]];

function gid() { return Math.random().toString(36).substr(2, 9); }

// ============ STATE ============
let boards = []; // [{gridSize, items:[], selectedSize:{w,h}, giftCount, stats}]

// Drag state
let dragState = null; // { boardIdx, itemId, item, offsetR, offsetC }

function initJourney() {
  const n = Math.max(1, Math.min(30, +document.getElementById("boardCount").value || 5));
  boards = [];
  for (let i = 0; i < n; i++) {
    boards.push({ gridSize: 6, items: [], selectedSize: {w:1,h:2}, giftCount: 0, stats: null });
  }
  document.getElementById("aggStats").classList.add("hidden");
  document.getElementById("exportPanel").classList.add("hidden");
  renderAll();
  updateButtons();
}

function updateButtons() {
  const hasItems = boards.some(b => b.items.length > 0);
  document.getElementById("simAllBtn").disabled = !hasItems;
  document.getElementById("exportBtn").disabled = !hasItems;
}

// ============ BOARD OPERATIONS ============
function setGridSize(idx, size) {
  boards[idx].gridSize = +size;
  boards[idx].items = [];
  boards[idx].stats = null;
  renderBoard(idx);
  updateButtons();
}

function setItemSize(idx, val) {
  const [w, h] = val.split("x").map(Number);
  boards[idx].selectedSize = { w, h };
}

function addItem(idx, row, col) {
  const b = boards[idx];
  const { w, h } = b.selectedSize;
  const gs = b.gridSize;
  if (row + h > gs || col + w > gs) return;
  const grid = buildGrid(b);
  for (let r = row; r < row + h; r++)
    for (let c = col; c < col + w; c++)
      if (grid[r][c] !== null) return;
  b.items.push({ id: gid(), row, col, w, h, color: ITEM_COLORS[b.items.length % ITEM_COLORS.length] });
  b.stats = null;
  renderBoard(idx);
  updateButtons();
  renderExposureTable();
}

function removeItem(idx, row, col) {
  const b = boards[idx];
  const grid = buildGrid(b);
  const cell = grid[row][col];
  if (!cell) return;
  b.items = b.items.filter(it => it.id !== cell.id);
  b.stats = null;
  renderBoard(idx);
  updateButtons();
  renderExposureTable();
}

function clearBoard(idx) {
  boards[idx].items = [];
  boards[idx].stats = null;
  renderBoard(idx);
  updateButtons();
  renderExposureTable();
}

function setGiftCount(idx, val) {
  boards[idx].giftCount = Math.max(0, Math.min(20, +val || 0));
  boards[idx].stats = null;
  renderBoard(idx);
}

function deleteBoard(idx) {
  boards.splice(idx, 1);
  renderAll();
  updateButtons();
}

function addBoard() {
  boards.push({ gridSize: 6, items: [], selectedSize: {w:1,h:2}, stats: null });
  renderAll();
  updateButtons();
}

function buildGrid(b) {
  const grid = Array.from({length: b.gridSize}, () => Array(b.gridSize).fill(null));
  b.items.forEach(it => {
    for (let r = it.row; r < it.row + it.h; r++)
      for (let c = it.col; c < it.col + it.w; c++)
        if (r < b.gridSize && c < b.gridSize) grid[r][c] = it;
  });
  return grid;
}

function boardToString(b) {
  const grid = Array.from({length: b.gridSize}, () => Array(b.gridSize).fill('0'));
  b.items.forEach((it, i) => {
    const letter = String.fromCharCode(65 + i);
    for (let r = it.row; r < it.row + it.h; r++)
      for (let c = it.col; c < it.col + it.w; c++)
        grid[r][c] = letter;
  });
  return grid.flat().join('');
}

// ============ RENDERING ============
function renderAll() {
  const container = document.getElementById("boardsContainer");
  container.innerHTML = "";
  boards.forEach((_, idx) => {
    const wrapper = document.createElement("div");
    wrapper.id = `board-${idx}`;
    container.appendChild(wrapper);
    renderBoard(idx);
  });
  // Add board button
  const addBtn = document.createElement("div");
  addBtn.style.cssText = "display:flex;align-items:center;justify-content:center;min-width:120px;min-height:200px;border:2px dashed #2a2a3e;border-radius:8px;cursor:pointer;color:#444;font-size:24px;";
  addBtn.textContent = "+";
  addBtn.title = "Add board";
  addBtn.addEventListener("click", addBoard);
  container.appendChild(addBtn);
  renderExposureTable();
}

function renderBoard(idx) {
  const b = boards[idx];
  const gs = b.gridSize;
  const grid = buildGrid(b);
  const cs = 32; // cell size
  const wrapper = document.getElementById(`board-${idx}`);
  if (!wrapper) return;

  const totalCells = gs * gs;
  const coverage = b.items.reduce((s, it) => s + it.w * it.h, 0);
  const covPct = ((coverage / totalCells) * 100).toFixed(0);
  const shipDesc = b.items.map(it => `${it.w}x${it.h}`).join(", ");

  // Build size options
  const sizeOptions = [];
  const seen = new Set();
  for (const [w, h] of SHIPS) {
    if (w <= gs && h <= gs) {
      const k = `${w}x${h}`;
      if (!seen.has(k)) { seen.add(k); sizeOptions.push({w, h}); }
    }
  }
  const selVal = `${b.selectedSize.w}x${b.selectedSize.h}`;

  let html = `<div class="panel" style="min-width:${gs*cs+40}px">`;

  // Header
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <span style="font-size:12px;color:#fff;font-weight:600">Board ${idx+1}</span>
    <button class="btn btn-danger" onclick="deleteBoard(${idx})" style="padding:2px 8px;font-size:9px">✕</button>
  </div>`;

  // Controls
  html += `<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap">
    <select onchange="setGridSize(${idx},this.value)" style="font-size:10px;padding:2px 4px">
      ${[4,5,6,7,8,9,10].map(s => `<option value="${s}" ${s===gs?'selected':''}>${s}x${s}</option>`).join("")}
    </select>
    <select onchange="setItemSize(${idx},this.value)" style="font-size:10px;padding:2px 4px">
      ${sizeOptions.map(s => `<option value="${s.w}x${s.h}" ${`${s.w}x${s.h}`===selVal?'selected':''}>${s.w}x${s.h}</option>`).join("")}
    </select>
    <span style="font-size:9px;color:#FFD700;display:flex;align-items:center;gap:3px">🎁
      <input type="number" value="${b.giftCount}" min="0" max="20" onchange="setGiftCount(${idx},this.value)" style="width:36px;font-size:10px;padding:2px 4px;color:#FFD700;border-color:#FFD70044;text-align:center">
    </span>
    <button class="btn" onclick="clearBoard(${idx})" style="padding:2px 8px;font-size:9px">Clear</button>
  </div>`;

  // Grid
  html += `<div id="grid-${idx}" style="display:inline-grid;grid-template-columns:repeat(${gs},${cs}px);grid-template-rows:repeat(${gs},${cs}px);gap:1px;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:4px;padding:1px">`;

  for (let r = 0; r < gs; r++) {
    for (let c = 0; c < gs; c++) {
      const cell = grid[r][c];
      let bg = "#12121e";
      let content = "";
      let border = "1px solid transparent";
      let cursor = "pointer";
      if (cell) {
        bg = cell.color + "cc";
        cursor = "grab";
        if (cell.row === r && cell.col === c) content = `<span style="font-size:8px;color:rgba(255,255,255,0.8)">${cell.w}x${cell.h}</span>`;
      }
      html += `<div
        onmousedown="cellMouseDown(event,${idx},${r},${c})"
        onmouseup="cellMouseUp(event,${idx},${r},${c})"
        onmouseenter="cellMouseEnter(event,${idx},${r},${c})"
        oncontextmenu="cellRightClick(event,${idx},${r},${c})"
        data-r="${r}" data-c="${c}"
        style="width:${cs}px;height:${cs}px;background:${bg};border:${border};border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:${cursor};font-size:9px;user-select:none">${content}</div>`;
    }
  }
  html += `</div>`;

  // Stats
  html += `<div style="margin-top:6px;font-size:9px;color:#666">
    <span>Items: <span style="color:#fff">${b.items.length}</span></span>
    <span style="margin-left:8px">Cov: <span style="color:#fff">${coverage}/${totalCells}</span> <span style="color:#555">(${covPct}%)</span></span>
    ${b.giftCount > 0 ? `<span style="margin-left:8px">🎁: <span style="color:#FFD700">${b.giftCount}</span></span>` : ''}
  </div>`;

  if (shipDesc) {
    html += `<div style="margin-top:2px;font-size:8px;color:#555">${shipDesc}</div>`;
  }

  // New items badge
  const newItems = getNewItemsForBoard(idx);
  if (newItems.length > 0) {
    html += `<div style="margin-top:4px;display:flex;gap:3px;flex-wrap:wrap">`;
    for (const s of newItems) {
      html += `<span style="padding:1px 5px;background:#2ECC7122;border:1px solid #2ECC7144;border-radius:3px;color:#2ECC71;font-size:8px;font-weight:600">🆕 ${s}</span>`;
    }
    html += `</div>`;
  }

  // Sim results
  if (b.stats) {
    const s = b.stats;
    html += `<div style="margin-top:6px;padding:6px 8px;background:#0a0a14;border-radius:4px;font-size:9px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span>EV: <span style="color:#F39C12;font-weight:700">${s.avg.toFixed(1)}</span></span>
        <span>Med: <span style="color:#3498DB">${s.median}</span></span>
        <span>P10: <span style="color:#1ABC9C">${s.p10}</span></span>
        <span>P90: <span style="color:#E67E22">${s.p90}</span></span>
      </div>
      ${s.avgGifts !== undefined && b.giftCount > 0 ? `<div style="margin-top:4px;padding-top:4px;border-top:1px solid #1e1e30;color:#FFD700">
        🎁 Avg gifts found: <span style="font-weight:700">${s.avgGifts.toFixed(2)}</span> / ${b.giftCount}
        <span style="color:#888;margin-left:4px">(${((s.avgGifts / b.giftCount) * 100).toFixed(0)}%)</span>
      </div>` : ''}
    </div>`;
  }

  html += `</div>`;
  wrapper.innerHTML = html;
}

// ============ SIMULATION ============
function precomputePlacements(gs, shapes) {
  const placements = {};
  for (const [sw, sh] of new Set(shapes.map(s => `${s[0]},${s[1]}`))) {
    const [w, h] = sw.split ? [+sw.split(",")[0], +sw.split(",")[1]] : [sw, sh];
  }
  // simpler approach
  const uniqueShapes = [];
  const seenS = new Set();
  for (const s of shapes) {
    const k = `${s[0]},${s[1]}`;
    if (!seenS.has(k)) { seenS.add(k); uniqueShapes.push(s); }
  }
  const result = {};
  for (const [sw, sh] of uniqueShapes) {
    const pls = [];
    for (let r = 0; r <= gs - sh; r++) {
      for (let c = 0; c <= gs - sw; c++) {
        const cells = new Set();
        for (let dr = 0; dr < sh; dr++)
          for (let dc = 0; dc < sw; dc++)
            cells.add((r+dr)*gs+(c+dc));
        pls.push(cells);
      }
    }
    result[`${sw},${sh}`] = pls;
  }
  return result;
}

function simBoardSmart(gs, boardItems, numSims) {
  const totalCells = gs * gs;
  const itemCellsList = boardItems.map(it => {
    const cells = new Set();
    for (let r = it.row; r < it.row + it.h; r++)
      for (let c = it.col; c < it.col + it.w; c++)
        cells.add(r * gs + c);
    return cells;
  });
  const itemShapes = boardItems.map(it => [it.w, it.h]);
  const placements = precomputePlacements(gs, itemShapes);

  const results = [];
  for (let s = 0; s < numSims; s++) {
    const unrevealed = new Set(Array.from({length: totalCells}, (_, i) => i));
    const found = new Set();
    let glasses = 0;
    while (found.size < boardItems.length) {
      const unfoundShapes = new Set();
      for (let i = 0; i < boardItems.length; i++)
        if (!found.has(i)) unfoundShapes.add(`${itemShapes[i][0]},${itemShapes[i][1]}`);
      const candidateCells = new Set();
      for (const key of unfoundShapes) {
        for (const pl of (placements[key] || [])) {
          let fits = true;
          for (const c of pl) { if (!unrevealed.has(c)) { fits = false; break; } }
          if (fits) for (const c of pl) candidateCells.add(c);
        }
      }
      const pickFrom = candidateCells.size > 0 ? Array.from(candidateCells) : Array.from(unrevealed);
      const pick = pickFrom[Math.floor(Math.random() * pickFrom.length)];
      glasses++;
      unrevealed.delete(pick);
      for (let i = 0; i < itemCellsList.length; i++) {
        if (!found.has(i) && itemCellsList[i].has(pick)) {
          found.add(i);
          for (const c of itemCellsList[i]) {
            if (unrevealed.has(c)) { glasses++; unrevealed.delete(c); }
          }
          break;
        }
      }
    }
    results.push(glasses);
  }
  results.sort((a, b) => a - b);
  return {
    avg: results.reduce((a, b) => a + b, 0) / results.length,
    median: results[Math.floor(results.length / 2)],
    p10: results[Math.floor(results.length * 0.1)],
    p90: results[Math.floor(results.length * 0.9)],
  };
}

function simulateAll() {
  const btn = document.getElementById("simAllBtn");
  btn.disabled = true;
  btn.textContent = "Simulating...";

  setTimeout(() => {
    const NUM_SIMS = 20000;
    const validBoards = boards.filter(b => b.items.length > 0);
    const perBoardResults = validBoards.map(() => []);

    for (let s = 0; s < NUM_SIMS; s++) {
      for (let i = 0; i < validBoards.length; i++) {
        const b = validBoards[i];
        const gs = b.gridSize;
        const totalCells = gs * gs;
        const itemShapes = b.items.map(it => [it.w, it.h]);
        const itemCellsList = b.items.map(it => {
          const cells = new Set();
          for (let r = it.row; r < it.row + it.h; r++)
            for (let c = it.col; c < it.col + it.w; c++)
              cells.add(r * gs + c);
          return cells;
        });
        const allItemCells = new Set();
        for (const cells of itemCellsList) for (const c of cells) allItemCells.add(c);

        // Randomly place gifts on empty cells
        const giftCount = b.giftCount || 0;
        const emptyCells = [];
        for (let ci = 0; ci < totalCells; ci++) if (!allItemCells.has(ci)) emptyCells.push(ci);
        const giftCells = new Set();
        if (giftCount > 0 && emptyCells.length > 0) {
          const shuffled = emptyCells.slice();
          for (let gi = shuffled.length - 1; gi > 0; gi--) {
            const j = Math.floor(Math.random() * (gi + 1));
            [shuffled[gi], shuffled[j]] = [shuffled[j], shuffled[gi]];
          }
          for (let gi = 0; gi < Math.min(giftCount, shuffled.length); gi++) giftCells.add(shuffled[gi]);
        }

        const plc = precomputePlacements(gs, itemShapes);
        const unrevealed = new Set(Array.from({length: totalCells}, (_, ii) => ii));
        const found = new Set();
        let glasses = 0;
        let giftsFound = 0;

        while (found.size < b.items.length) {
          const ufs = new Set();
          for (let j = 0; j < b.items.length; j++)
            if (!found.has(j)) ufs.add(`${itemShapes[j][0]},${itemShapes[j][1]}`);
          const cc = new Set();
          for (const key of ufs)
            for (const pl of (plc[key]||[]))
              if ([...pl].every(c => unrevealed.has(c)))
                for (const c of pl) cc.add(c);
          const pf = cc.size > 0 ? [...cc] : [...unrevealed];
          const pick = pf[Math.floor(Math.random() * pf.length)];
          glasses++; unrevealed.delete(pick);

          // Check gift
          if (giftCells.has(pick)) giftsFound++;

          for (let j = 0; j < itemCellsList.length; j++) {
            if (!found.has(j) && itemCellsList[j].has(pick)) {
              found.add(j);
              for (const c of itemCellsList[j]) {
                if (unrevealed.has(c)) {
                  glasses++; unrevealed.delete(c);
                  if (giftCells.has(c)) giftsFound++;
                }
              }
              break;
            }
          }
        }
        perBoardResults[i].push({ glasses, giftsFound });
      }
    }

    // Per-board stats
    let vi = 0;
    for (let i = 0; i < boards.length; i++) {
      if (boards[i].items.length === 0) { boards[i].stats = null; continue; }
      const br = perBoardResults[vi];
      const glassArr = br.map(r => r.glasses).sort((a, b) => a - b);
      const giftArr = br.map(r => r.giftsFound);
      const avgGifts = giftArr.reduce((a, b) => a + b, 0) / giftArr.length;
      boards[i].stats = {
        avg: glassArr.reduce((a, b) => a + b, 0) / glassArr.length,
        median: glassArr[Math.floor(glassArr.length / 2)],
        p10: glassArr[Math.floor(glassArr.length * 0.1)],
        p90: glassArr[Math.floor(glassArr.length * 0.9)],
        avgGifts,
      };
      vi++;
    }

    // Aggregate
    const totals = [];
    let totalGiftsAll = 0;
    for (let s = 0; s < NUM_SIMS; s++) {
      let t = 0;
      let g = 0;
      for (let i = 0; i < perBoardResults.length; i++) {
        t += perBoardResults[i][s].glasses;
        g += perBoardResults[i][s].giftsFound;
      }
      totals.push(t);
      totalGiftsAll += g;
    }
    totals.sort((a, b) => a - b);
    const aggAvgGifts = totalGiftsAll / NUM_SIMS;
    const totalGiftsOnBoards = validBoards.reduce((s, b) => s + (b.giftCount || 0), 0);

    const aggEl = document.getElementById("aggStats");
    aggEl.classList.remove("hidden");
    const aggAvg = totals.reduce((a, b) => a + b, 0) / totals.length;
    const aggMed = totals[Math.floor(totals.length / 2)];
    const aggP10 = totals[Math.floor(totals.length * 0.1)];
    const aggP90 = totals[Math.floor(totals.length * 0.9)];
    const aggMin = totals[0];
    const aggMax = totals[totals.length - 1];

    aggEl.innerHTML = `
      <div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.5px">All ${validBoards.length} Boards — 20K Users</div>
      <div style="text-align:center;padding:4px 14px;background:#0a0a14;border-radius:6px">
        <div style="font-size:8px;color:#555;text-transform:uppercase">Avg</div>
        <div style="font-size:20px;font-weight:700;color:#F39C12">${aggAvg.toFixed(1)}</div>
      </div>
      <div style="text-align:center;padding:4px 14px;background:#0a0a14;border-radius:6px">
        <div style="font-size:8px;color:#555;text-transform:uppercase">Median</div>
        <div style="font-size:20px;font-weight:700;color:#3498DB">${aggMed}</div>
      </div>
      <div style="text-align:center;padding:4px 14px;background:#0a0a14;border-radius:6px">
        <div style="font-size:8px;color:#555;text-transform:uppercase">Lucky P10</div>
        <div style="font-size:20px;font-weight:700;color:#1ABC9C">${aggP10}</div>
      </div>
      <div style="text-align:center;padding:4px 14px;background:#0a0a14;border-radius:6px">
        <div style="font-size:8px;color:#555;text-transform:uppercase">Unlucky P90</div>
        <div style="font-size:20px;font-weight:700;color:#E67E22">${aggP90}</div>
      </div>
      <div style="text-align:center;padding:4px 14px;background:#0a0a14;border-radius:6px">
        <div style="font-size:8px;color:#555;text-transform:uppercase">Best</div>
        <div style="font-size:20px;font-weight:700;color:#2ECC71">${aggMin}</div>
      </div>
      <div style="text-align:center;padding:4px 14px;background:#0a0a14;border-radius:6px">
        <div style="font-size:8px;color:#555;text-transform:uppercase">Worst</div>
        <div style="font-size:20px;font-weight:700;color:#E74C3C">${aggMax}</div>
      </div>
      ${totalGiftsOnBoards > 0 ? `<div style="text-align:center;padding:4px 14px;background:#0a0a14;border-radius:6px;border:1px solid #FFD70022">
        <div style="font-size:8px;color:#FFD700;text-transform:uppercase">🎁 Avg Gifts</div>
        <div style="font-size:20px;font-weight:700;color:#FFD700">${aggAvgGifts.toFixed(1)} <span style="font-size:11px;color:#888">/ ${totalGiftsOnBoards}</span></div>
      </div>` : ''}
    `;

    renderAll();
    btn.disabled = false;
    btn.textContent = "Simulate All (20K)";
  }, 50);
}

// ============ EXPORT ============
function exportJourney() {
  const parts = [];
  for (const b of boards) {
    if (b.items.length === 0) continue;
    const bstr = boardToString(b);
    const n = b.items.length;
    const gs = b.gridSize;
    const cov = b.items.reduce((s, it) => s + it.w * it.h, 0);
    if (b.stats) {
      parts.push(`${bstr}#${n}#${gs}X${gs}#${cov}#${b.stats.avg.toFixed(1)}#${b.stats.median}#${b.stats.p10}#${b.stats.p90}`);
    } else {
      parts.push(`${bstr}#${n}#${gs}X${gs}#${cov}`);
    }
  }
  const result = parts.join("$");
  document.getElementById("exportStr").textContent = result;
  document.getElementById("exportPanel").classList.remove("hidden");
  document.getElementById("copyBtn").textContent = "Copy";
}

function copyExport() {
  const text = document.getElementById("exportStr").textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "Copied!";
    btn.style.background = "#2ECC71"; btn.style.color = "#000";
    setTimeout(() => { btn.textContent = "Copy"; btn.style.background = ""; btn.style.color = ""; }, 2000);
  }).catch(() => {});
}

// ============ IMPORT ============
function parseBoardString(code) {
  code = code.toUpperCase().trim();
  // Strip stats after first #
  const boardPart = code.split("#")[0];
  const len = boardPart.length;
  const size = Math.round(Math.sqrt(len));
  if (size * size !== len || size < 4 || size > 10) return null;
  if (!/^[0A-Z]+$/.test(boardPart)) return null;

  const letterCells = {};
  for (let i = 0; i < len; i++) {
    const ch = boardPart[i];
    if (ch === "0") continue;
    if (!letterCells[ch]) letterCells[ch] = [];
    letterCells[ch].push({ row: Math.floor(i / size), col: i % size });
  }

  const items = [];
  for (const letter of Object.keys(letterCells).sort()) {
    const cells = letterCells[letter];
    const minR = Math.min(...cells.map(c => c.row)), maxR = Math.max(...cells.map(c => c.row));
    const minC = Math.min(...cells.map(c => c.col)), maxC = Math.max(...cells.map(c => c.col));
    const w = maxC - minC + 1, h = maxR - minR + 1;
    if (cells.length !== w * h) return null;
    for (let r = minR; r <= maxR; r++)
      for (let c = minC; c <= maxC; c++)
        if (boardPart[r * size + c] !== letter) return null;
    items.push({ id: gid(), row: minR, col: minC, w, h, color: ITEM_COLORS[items.length % ITEM_COLORS.length] });
  }
  return { gridSize: size, items, selectedSize: {w:1,h:2}, giftCount: 0, stats: null };
}

function importJourney() {
  const raw = document.getElementById("journeyImportInput").value.trim();
  if (!raw) return;

  // Split by $ for journey format
  const dollarParts = raw.split("$").filter(s => s.length > 0);
  const parsed = [];

  for (const part of dollarParts) {
    const board = parseBoardString(part);
    if (board) parsed.push(board);
  }

  // Fallback: try # separator (multi-board format)
  if (parsed.length === 0) {
    const hashParts = raw.split("#").filter(s => s.length > 0);
    for (const part of hashParts) {
      const board = parseBoardString(part);
      if (board) parsed.push(board);
    }
  }

  if (parsed.length === 0) {
    alert("No valid boards found. Use $ to separate boards.");
    return;
  }

  boards = parsed;
  document.getElementById("boardCount").value = boards.length;
  document.getElementById("aggStats").classList.add("hidden");
  document.getElementById("exportPanel").classList.add("hidden");
  renderAll();
  updateButtons();
}

// ============ DRAG & DROP ============
function cellMouseDown(e, boardIdx, r, c) {
  if (e.button !== 0) return; // left click only
  e.preventDefault();
  const b = boards[boardIdx];
  const grid = buildGrid(b);
  const cell = grid[r][c];
  
  if (cell) {
    // Start dragging existing item
    dragState = {
      boardIdx,
      itemId: cell.id,
      item: cell,
      offsetR: r - cell.row,
      offsetC: c - cell.col,
      moved: false,
    };
  } else {
    // Clicked empty cell — place new item immediately
    dragState = null;
    addItem(boardIdx, r, c);
  }
}

function cellMouseEnter(e, boardIdx, r, c) {
  if (!dragState || dragState.boardIdx !== boardIdx) return;
  dragState.moved = true;
  
  const b = boards[boardIdx];
  const it = dragState.item;
  const newRow = r - dragState.offsetR;
  const newCol = c - dragState.offsetC;
  const gs = b.gridSize;
  
  if (newRow < 0 || newCol < 0 || newRow + it.h > gs || newCol + it.w > gs) return;
  
  for (let dr = 0; dr < it.h; dr++) {
    for (let dc = 0; dc < it.w; dc++) {
      const checkR = newRow + dr;
      const checkC = newCol + dc;
      for (const other of b.items) {
        if (other.id === dragState.itemId) continue;
        if (checkR >= other.row && checkR < other.row + other.h &&
            checkC >= other.col && checkC < other.col + other.w) return;
      }
    }
  }
  
  const item = b.items.find(i => i.id === dragState.itemId);
  if (item) {
    item.row = newRow;
    item.col = newCol;
    b.stats = null;
    renderBoard(boardIdx);
  }
}

function cellMouseUp(e, boardIdx, r, c) {
  if (!dragState) return;
  dragState = null;
  updateButtons();
  renderExposureTable();
}

function cellRightClick(e, boardIdx, r, c) {
  e.preventDefault();
  dragState = null; // cancel any drag
  removeItem(boardIdx, r, c);
}

document.addEventListener("mouseup", () => {
  if (dragState) dragState = null;
});

// ============ ITEM EXPOSURE TRACKING ============
function getItemExposureMap() {
  // Returns: { "1x2": firstBoardIndex, "2x3": firstBoardIndex, ... }
  const firstSeen = {};
  for (let i = 0; i < boards.length; i++) {
    for (const it of boards[i].items) {
      const key = `${it.w}x${it.h}`;
      if (!(key in firstSeen)) firstSeen[key] = i;
    }
  }
  return firstSeen;
}

function getNewItemsForBoard(boardIdx) {
  // Returns array of item size strings that are NEW on this board
  const firstSeen = getItemExposureMap();
  const newItems = [];
  for (const [key, idx] of Object.entries(firstSeen)) {
    if (idx === boardIdx) newItems.push(key);
  }
  return newItems;
}

function renderExposureTable() {
  const section = document.getElementById("exposureSection");
  const tableEl = document.getElementById("exposureTable");
  const timelineEl = document.getElementById("exposureTimeline");
  
  // Check if any boards have items
  const hasAny = boards.some(b => b.items.length > 0);
  if (!hasAny) { section.classList.add("hidden"); return; }
  section.classList.remove("hidden");

  const firstSeen = getItemExposureMap();
  
  // Sort items by first appearance, then by size
  const allItems = Object.entries(firstSeen).sort((a, b) => {
    if (a[1] !== b[1]) return a[1] - b[1];
    const [aw, ah] = a[0].split("x").map(Number);
    const [bw, bh] = b[0].split("x").map(Number);
    return (aw * ah) - (bw * bh);
  });

  if (allItems.length === 0) { section.classList.add("hidden"); return; }

  // Table: rows = boards, columns show what's new
  let html = `<table style="width:100%;border-collapse:collapse;font-size:11px">`;
  html += `<tr style="border-bottom:1px solid #2a2a3e">
    <th style="padding:6px 8px;text-align:left;color:#666;font-size:9px;text-transform:uppercase">Board</th>
    <th style="padding:6px 8px;text-align:left;color:#666;font-size:9px;text-transform:uppercase">Grid</th>
    <th style="padding:6px 8px;text-align:left;color:#666;font-size:9px;text-transform:uppercase">Items</th>
    <th style="padding:6px 8px;text-align:left;color:#666;font-size:9px;text-transform:uppercase">Coverage</th>
    <th style="padding:6px 8px;text-align:left;color:#2ECC71;font-size:9px;text-transform:uppercase">🆕 New Items</th>
    <th style="padding:6px 8px;text-align:left;color:#666;font-size:9px;text-transform:uppercase">All Item Sizes</th>
    <th style="padding:6px 8px;text-align:left;color:#666;font-size:9px;text-transform:uppercase">EV</th>
  </tr>`;

  for (let i = 0; i < boards.length; i++) {
    const b = boards[i];
    if (b.items.length === 0) {
      html += `<tr style="border-bottom:1px solid #1e1e30">
        <td style="padding:5px 8px;color:#555">${i+1}</td>
        <td style="padding:5px 8px;color:#555">${b.gridSize}x${b.gridSize}</td>
        <td colspan="5" style="padding:5px 8px;color:#444;font-style:italic">Empty board</td>
      </tr>`;
      continue;
    }

    const gs = b.gridSize;
    const totalCells = gs * gs;
    const coverage = b.items.reduce((s, it) => s + it.w * it.h, 0);
    const covPct = ((coverage / totalCells) * 100).toFixed(0);
    const newItems = getNewItemsForBoard(i);
    const allSizes = b.items.map(it => `${it.w}x${it.h}`).join(", ");
    const ev = b.stats ? b.stats.avg.toFixed(1) : "-";

    const newBadges = newItems.length > 0
      ? newItems.map(s => `<span style="display:inline-block;padding:2px 6px;background:#2ECC7122;border:1px solid #2ECC7144;border-radius:3px;color:#2ECC71;font-weight:600;margin-right:3px">${s}</span>`).join("")
      : `<span style="color:#444">—</span>`;

    html += `<tr style="border-bottom:1px solid #1e1e30;${newItems.length > 0 ? 'background:#2ECC7108' : ''}">
      <td style="padding:5px 8px;color:#fff;font-weight:600">${i+1}</td>
      <td style="padding:5px 8px;color:#aaa">${gs}x${gs}</td>
      <td style="padding:5px 8px;color:#aaa">${b.items.length}</td>
      <td style="padding:5px 8px;color:#aaa">${covPct}%</td>
      <td style="padding:5px 8px">${newBadges}</td>
      <td style="padding:5px 8px;color:#666;font-size:10px">${allSizes}</td>
      <td style="padding:5px 8px;color:${b.stats ? '#F39C12' : '#444'};font-weight:${b.stats ? '600' : '400'}">${ev}</td>
    </tr>`;
  }
  html += `</table>`;
  tableEl.innerHTML = html;

  // Timeline: visual overview of when each item type appears
  const itemColors = {
    "1x2":"#E74C3C","2x1":"#E74C3C","1x3":"#3498DB","3x1":"#3498DB",
    "1x4":"#2ECC71","4x1":"#2ECC71","2x2":"#F39C12","2x3":"#9B59B6",
    "3x2":"#9B59B6","2x4":"#1ABC9C","4x2":"#1ABC9C","3x3":"#E67E22",
    "3x4":"#EC407A","4x3":"#EC407A","4x4":"#26C6DA",
  };

  let tlHtml = `<div style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Introduction Timeline</div>`;
  tlHtml += `<div style="display:flex;gap:3px;align-items:flex-end">`;
  
  for (let i = 0; i < boards.length; i++) {
    const newItems = getNewItemsForBoard(i);
    const hasItems = boards[i].items.length > 0;
    
    tlHtml += `<div style="flex:1;min-width:30px;text-align:center">`;
    if (newItems.length > 0) {
      for (const item of newItems) {
        const col = itemColors[item] || "#888";
        tlHtml += `<div style="padding:2px 4px;background:${col}33;border:1px solid ${col}66;border-radius:3px;color:${col};font-size:8px;font-weight:600;margin-bottom:2px">${item}</div>`;
      }
    }
    tlHtml += `<div style="padding:4px 2px;background:${hasItems ? '#1e1e30' : '#12121e'};border-radius:2px;color:#555;font-size:9px;font-weight:${newItems.length > 0 ? '700' : '400'};border-top:2px solid ${newItems.length > 0 ? '#2ECC71' : '#1e1e30'}">${i+1}</div>`;
    tlHtml += `</div>`;
  }
  tlHtml += `</div>`;
  timelineEl.innerHTML = tlHtml;

  // Unused items: which ship sizes from the full list were never used
  const allPossible = ["1x2","2x1","1x3","3x1","1x4","4x1","2x2","2x3","3x2","2x4","4x2","3x3","3x4","4x3","4x4"];
  const usedItems = new Set(Object.keys(firstSeen));
  const unused = allPossible.filter(s => !usedItems.has(s));
  const unusedEl = document.getElementById("unusedItems");

  if (unused.length > 0) {
    let uHtml = `<div style="padding:10px 12px;background:#E74C3C0a;border:1px solid #E74C3C33;border-radius:6px">`;
    uHtml += `<div style="font-size:10px;color:#E74C3C;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-weight:600">⚠ Items Not Used In This Journey (${unused.length})</div>`;
    uHtml += `<div style="display:flex;gap:4px;flex-wrap:wrap">`;
    for (const s of unused) {
      uHtml += `<span style="display:inline-block;padding:3px 8px;background:#E74C3C15;border:1px solid #E74C3C44;border-radius:4px;color:#E74C3C;font-size:10px;font-weight:600">${s}</span>`;
    }
    uHtml += `</div></div>`;
    unusedEl.innerHTML = uHtml;
  } else {
    unusedEl.innerHTML = `<div style="padding:10px 12px;background:#2ECC710a;border:1px solid #2ECC7133;border-radius:6px">
      <span style="font-size:10px;color:#2ECC71;font-weight:600">✓ All item sizes are used in this journey!</span>
    </div>`;
  }
}

initJourney();
